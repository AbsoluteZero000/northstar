app = "hayat-dashboard-20260919"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  DATABASE = "/data/hayat.sqlite3"
  SESSION_COOKIE_SECURE = "true"
  SESSION_LIFETIME_HOURS = "12"
  PORT = "8080"

[[mounts]]
  source = "hayat_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "3s"
    grace_period = "20s"
    method = "GET"
    path = "/auth/login"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
