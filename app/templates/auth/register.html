{% extends 'base.html' %}{% block title %}{{ t('register') }} · {{ t('app_name') }}{% endblock %}{% block content %}
<section class="auth-card"><div class="brand large"><span>☾</span>{{ t('app_name') }}</div><h1>{{ t('register') }}</h1><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>{{ t('email') }}<input type="email" name="email" autocomplete="email" required></label><label>{{ t('password') }}<input type="password" name="password" autocomplete="new-password" minlength="10" required></label><label>{{ t('language') }}<select name="language"><option value="en">English</option><option value="ar">العربية</option></select></label><button>{{ t('register') }}</button></form><p><a href="{{ url_for('auth.login') }}">{{ t('login') }}</a></p></section>
{% endblock %}
